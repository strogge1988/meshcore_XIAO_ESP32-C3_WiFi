; MeshCore companion-v1.18.0 / XIAO ESP32-C3 + Wio-SX1262
; Exclusive BLE setup or Wi-Fi companion TCP mode (no simultaneous BLE + Wi-Fi).
; Do not include SSID/password in the firmware; configure using MeshCore app >= 1.50.0.
[env:Xiao_C3_companion_radio_ble_setup_wifi_only]
extends = env:Xiao_C3_companion_radio_ble
build_flags =
    ${env:Xiao_C3_companion_radio_ble.build_flags}
    -D ENABLE_WIFI_INTERFACE
    -D MESHCORE_C3_EXCLUSIVE_WIFI_SETUP
build_src_filter =
    ${env:Xiao_C3_companion_radio_ble.build_src_filter}
    +<helpers/wifi/*.cpp>
