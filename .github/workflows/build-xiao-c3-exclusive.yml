name: MeshCore 1.18.0 XIAO-C3 exclusive BLE setup + WiFi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout this build package
        uses: actions/checkout@v4
        with:
          path: recipe
          persist-credentials: false

      - name: Checkout official MeshCore 1.18.0
        uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: companion-v1.18.0
          path: MeshCore
          persist-credentials: false
          submodules: recursive

      - name: Verify pinned official release
        shell: bash
        working-directory: MeshCore
        run: |
          set -euo pipefail
          git log -1 --format='%h %s'
          test "$(git rev-parse --short=7 HEAD)" = '81dbae5'

      - name: Prepare Python and PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check and apply the exclusive transport customization
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s recipe/tests -v
          cp recipe/platformio.local.ini MeshCore/platformio.local.ini
          python recipe/apply_exclusive_transport.py MeshCore
          grep -q 'MC_C3_EXCLUSIVE_PATCH_V1' MeshCore/examples/companion_radio/main.cpp
          grep -q 'MESHCORE_C3_EXCLUSIVE_WIFI_SETUP' MeshCore/platformio.local.ini

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          python -m pip install 'platformio>=6.1,<7'
          python -m platformio --version

      - name: Compile application firmware
        working-directory: MeshCore
        run: python -m platformio run -e Xiao_C3_companion_radio_ble_setup_wifi_only

      - name: Produce complete flash image
        working-directory: MeshCore
        run: python -m platformio run -e Xiao_C3_companion_radio_ble_setup_wifi_only -t mergebin

      - name: Package firmware binaries
        shell: bash
        run: |
          set -euo pipefail
          base='MeshCore/.pio/build/Xiao_C3_companion_radio_ble_setup_wifi_only'
          test -s "$base/firmware.bin"
          test -s "$base/firmware-merged.bin"
          mkdir -p dist
          cp "$base/firmware.bin" dist/MeshCore-1.18.0-XIAO-C3-Wio-SX1262-exclusive.bin
          cp "$base/firmware-merged.bin" dist/MeshCore-1.18.0-XIAO-C3-Wio-SX1262-exclusive-merged.bin
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeshCore-1.18.0-XIAO-C3-exclusive-BLE-WiFi
          path: dist/
          if-no-files-found: error
          retention-days: 30
